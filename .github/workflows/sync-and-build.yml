name: Sync Upstream, Enforce EAC & Build

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Trigger a build even if already up to date with upstream'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  sync-enforce-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync with imputnet/helium-windows and enforce EAC flags
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/imputnet/helium-windows.git
          git fetch upstream main

          BEFORE_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse upstream/main)

          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "New upstream commits found. Merging upstream/main..."
            git merge upstream/main -X theirs --no-edit || true
          else
            echo "Fork already includes latest upstream commits."
          fi

          # Strip any existing definitions of the 3 codec flags in flags.windows.gn
          sed -i '/^[[:space:]]*proprietary_codecs[[:space:]]*=/d' flags.windows.gn
          sed -i '/^[[:space:]]*ffmpeg_branding[[:space:]]*=/d' flags.windows.gn
          sed -i '/^[[:space:]]*enable_platform_ac3_eac3_audio[[:space:]]*=/d' flags.windows.gn

          [ -n "$(tail -c1 flags.windows.gn)" ] && echo "" >> flags.windows.gn

          cat << 'EOF' >> flags.windows.gn
          proprietary_codecs=true
          ffmpeg_branding="Chrome"
          enable_platform_ac3_eac3_audio=true
          EOF

          grep -qx 'proprietary_codecs=true' flags.windows.gn
          grep -qx 'ffmpeg_branding="Chrome"' flags.windows.gn
          grep -qx 'enable_platform_ac3_eac3_audio=true' flags.windows.gn

          if ! git diff --quiet flags.windows.gn; then
            git add flags.windows.gn
            git commit -m "chore: enforce EAC and proprietary codecs in flags.windows.gn"
          fi

          AFTER_SHA=$(git rev-parse HEAD)

          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            git push origin main
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to push."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Windows Build & Release Workflow
        if: steps.sync.outputs.updated == 'true' || inputs.force_build == true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Locate the main workflow that contains "Build and release binaries" (excluding build-stage.yml)
          WORKFLOW_PATH=$(grep -rl "Build and release binaries" .github/workflows/ | grep -v "sync-and-build" | head -n 1)
          if [ -z "$WORKFLOW_PATH" ]; then
            for candidate in "release.yml" "build.yml" "ci.yml"; do
              if [ -f ".github/workflows/$candidate" ]; then
                WORKFLOW_PATH=".github/workflows/$candidate"
                break
              fi
            done
          fi

          WORKFLOW_FILE=$(basename "$WORKFLOW_PATH")
          echo "Found target workflow: $WORKFLOW_FILE"

          # Check if the workflow requires a boolean input to publish a release
          EXTRA_ARGS=()
          for input_name in "release" "publish" "publish_release" "create_release"; do
            if grep -qE "^[[:space:]]+${input_name}:" "$WORKFLOW_PATH"; then
              echo "Detected workflow input '$input_name', setting to true"
              EXTRA_ARGS+=("-f" "${input_name}=true")
            fi
          done

          gh workflow run "$WORKFLOW_FILE" --repo "${{ github.repository }}" --ref main "${EXTRA_ARGS[@]}"
          sleep 3
          gh run list --repo "${{ github.repository }}" --workflow "$WORKFLOW_FILE" --limit 1
